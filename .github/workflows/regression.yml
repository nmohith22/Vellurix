name: Regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build and run JVM checks
        run: bash gradlew testDebugUnitTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot tools
        run: |
          python3 -m venv .tmp/regression-venv
          .tmp/regression-venv/bin/pip install -r tests/requirements.txt
      - name: Run installed app regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-audio
          disable-animations: false
          script: .tmp/regression-venv/bin/python -B tests/android_regression.py --serial emulator-5554 --apk app/build/outputs/apk/debug/app-debug.apk
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vellurix-regression-evidence
          include-hidden-files: true
          path: |
            .tmp/android-regression/*.png
            .tmp/android-regression/*-crash.log
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
